version: '3.8'

services:
  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: seckill_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - seckill-net

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - seckill-net

  # ========== RabbitMQ ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seckill-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP 协议
      - "15672:15672"    # 管理界面
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - seckill-net



  # ========== 你的秒杀应用 ==========
  seckill-app:
    build: .
    container_name: seckill-app
    depends_on:
      - mysql
      - redis
      - rabbitmq

    environment:
      # 覆盖 application.yml 中的配置，指向容器内的服务名
      SPRING_DATASOURCE_URL: jdbc:mysql://192.168.5.101:3306/seckill_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: hostonly_user
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: 192.168.5.101
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: 192.168.5.101
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: 123456

    ports:
      - "8080:8080"
    networks:
      - seckill-net

# ========== 数据卷（持久化） ==========
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

# ========== 网络 ==========
networks:
  seckill-net:
    driver: bridge